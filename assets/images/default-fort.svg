<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0e2415"/>
            <stop offset="50%" stop-color="#163820"/>
            <stop offset="100%" stop-color="#244f30"/>
        </linearGradient>
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f5d77f"/>
            <stop offset="100%" stop-color="#c59b27"/>
        </linearGradient>
    </defs>
    <rect width="800" height="500" fill="url(#bgGrad)"/>
    <!-- Distant Mountains -->
    <path d="M0 380 L180 230 L320 340 L500 180 L650 310 L800 210 L800 500 L0 500 Z" fill="#0d2113" opacity="0.7"/>
    <!-- Closer Fort Mountain & Ramparts -->
    <path d="M100 500 L250 260 L360 260 L380 240 L440 240 L460 260 L580 260 L720 500 Z" fill="#14311c"/>
    <path d="M260 260 L260 240 L280 240 L280 248 L300 248 L300 240 L320 240 L320 248 L340 248 L340 240 L360 240 L360 260 Z" fill="#c59b27" opacity="0.8"/>
    <!-- Saffron Flag -->
    <path d="M410 240 L410 170 L460 190 L410 210 Z" fill="#e65100"/>
    <line x1="410" y1="240" x2="410" y2="170" stroke="#f5d77f" stroke-width="3"/>
    <!-- Text -->
    <text x="400" y="380" font-family="'Cinzel', Georgia, serif" font-size="28" font-weight="700" fill="#f5efe6" text-anchor="middle" letter-spacing="2">FORT EXPLORER</text>
    <text x="400" y="415" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#c59b27" text-anchor="middle" letter-spacing="3">MAHARASHTRA HERITAGE</text>
</svg>
